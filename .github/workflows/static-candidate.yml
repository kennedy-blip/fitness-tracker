name: Static candidate

on:
  pull_request:
    paths:
      - 'static-site/**'
      - 'vite*.config.ts'
      - '.python-version'
      - 'package*.json'
      - '.github/workflows/static-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: static-site/.python-version
          cache: pip
          cache-dependency-path: static-site/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python build.py

  render-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: npm ci && ./node_modules/.bin/vite build
      - run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory dist &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 5 --retry-connrefused --fail --silent http://127.0.0.1:8000/ -o /dev/null
          python static-site/smoke.py http://127.0.0.1:8000
