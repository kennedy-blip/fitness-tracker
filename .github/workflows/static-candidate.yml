name: Static candidate

on:
  pull_request:
    paths:
      - 'static-site/**'
      - '.github/workflows/static-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: static-site/.python-version
          cache: pip
          cache-dependency-path: static-site/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python build.py
